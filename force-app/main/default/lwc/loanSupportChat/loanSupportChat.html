<template>
    <lightning-card title="Loan Support Assistant" icon-name="standard:bot">
        <div class="slds-p-around_large">

            <!-- Header -->
            <div class="slds-m-bottom_large">
                <p class="slds-text-heading_small" style="color: #22a06b;">
                    AI-Powered Loan Support
                </p>
                <p class="slds-text-body_small slds-text-color_weak">
                    Ask about your loan status, EMI schedule, or repayment options.
                </p>
            </div>

            <!-- Loan Number Input -->
            <div class="slds-m-bottom_medium">
                <lightning-input type="text" label="Enter Loan Number" placeholder="e.g. LN-001" value={loanNumber}
                    onchange={handleLoanNumberChange}>
                </lightning-input>
            </div>

            <!-- Action Buttons -->
            <div class="slds-grid slds-gutters slds-m-bottom_large">
                <div class="slds-col slds-shrink-none">
                    <lightning-button variant="brand" label="Check Loan Status" onclick={handleLoanStatus}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
                <div class="slds-col slds-shrink-none">
                    <lightning-button variant="neutral" label="View EMI Schedule" onclick={handleEMISchedule}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
                <div class="slds-col slds-shrink-none">
                    <lightning-button variant="destructive-text" label="Clear" onclick={handleClear}>
                    </lightning-button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-m-bottom_medium">
                    <lightning-spinner alternative-text="Loading" size="small">
                    </lightning-spinner>
                    <p class="slds-text-body_small slds-m-top_small">
                        Fetching your details...
                    </p>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Loan Status Card -->
            <template if:true={hasResponse}>
                <div class="slds-box slds-box_small slds-theme_default slds-m-bottom_medium"
                    style="border-radius: 8px; border-left: 4px solid #0176d3;">

                    <!-- Card Header -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                        <div>
                            <p class="slds-text-heading_small">{responseTitle}</p>
                        </div>
                        <div>
                            <span class={statusBadgeClass}>{loanStatus}</span>
                        </div>
                    </div>

                    <!-- 2 Column Grid of Fields -->
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={responseFields} for:item="field">
                            <div key={field.label} class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-box slds-box_xx-small" style="background:#f3f3f3; border-radius:6px;">
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {field.label}
                                    </p>
                                    <p class="slds-text-heading_small" style="margin-top:4px;">
                                        {field.value}
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
            </template>

            <!-- EMI Schedule Table -->
            <template if:true={hasEMIData}>
                <div class="slds-box slds-box_small" style="border-radius: 8px; border-left: 4px solid #22a06b;">

                    <p class="slds-text-heading_small slds-m-bottom_medium">
                        Upcoming EMI Schedule
                    </p>

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="slds-text-title_caps" scope="col">
                                    <div class="slds-truncate">#</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    <div class="slds-truncate">Due Date</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    <div class="slds-truncate">Amount</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col">
                                    <div class="slds-truncate">Status</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={emiList} for:item="emi">
                                <tr key={emi.dueDate}>
                                    <td>{emi.index}</td>
                                    <td>
                                        <div class="slds-truncate">{emi.dueDate}</div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate">
                                            <strong>₹{emi.amount}</strong>
                                        </div>
                                    </td>
                                    <td>
                                        <span class={emi.statusClass}>
                                            {emi.status}
                                        </span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                </div>
            </template>

        </div>
    </lightning-card>
</template>
